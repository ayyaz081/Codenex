<!-- 
  SEO Meta Tags Template
  Copy and customize these tags for each page
  Replace [PAGE_TITLE], [PAGE_DESCRIPTION], [PAGE_URL], [PAGE_IMAGE]
-->

<!-- Primary Meta Tags -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>[PAGE_TITLE] | Codenex Solutions</title>
<meta name="title" content="[PAGE_TITLE] | Codenex Solutions">
<meta name="description" content="[PAGE_DESCRIPTION]">
<meta name="keywords" content="cloud migration, cybersecurity, data analytics, AI solutions, IT consulting, digital transformation, DevOps, Codenex Solutions">
<meta name="author" content="Codenex Solutions">
<meta name="robots" content="index, follow">
<meta name="language" content="English">
<meta name="revisit-after" content="7 days">

<!-- Canonical URL -->
<link rel="canonical" href="https://Codenex.com/[PAGE_URL]">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://Codenex.com/[PAGE_URL]">
<meta property="og:title" content="[PAGE_TITLE] | Codenex Solutions">
<meta property="og:description" content="[PAGE_DESCRIPTION]">
<meta property="og:image" content="https://Codenex.com/[PAGE_IMAGE]">
<meta property="og:site_name" content="Codenex Solutions">
<meta property="og:locale" content="en_US">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="https://Codenex.com/[PAGE_URL]">
<meta property="twitter:title" content="[PAGE_TITLE] | Codenex Solutions">
<meta property="twitter:description" content="[PAGE_DESCRIPTION]">
<meta property="twitter:image" content="https://Codenex.com/[PAGE_IMAGE]">

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="/components/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/components/favicon.ico">

<!-- Theme Color -->
<meta name="theme-color" content="#0066cc">

<!-- Structured Data - Organization Schema (add to every page) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Codenex Solutions",
  "url": "https://Codenex.com",
  "logo": "https://Codenex.com/content/logo.png",
  "description": "Codenex Solutions specializes in cloud migration, cybersecurity, and data analytics solutions for businesses worldwide.",
  "foundingDate": "2020",
  "address": {
    "@type": "PostalAddress",
    "addressCountry": "PK"
  },
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "Customer Service",
    "email": "info@Codenex.com"
  },
  "sameAs": [
    "https://www.linkedin.com/company/CODENEX-technologies",
    "https://twitter.com/CODENEX",
    "https://github.com/codenexsolutions"
  ]
}
</script>

<!-- Structured Data - Website Schema (add to homepage) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Codenex Solutions",
  "url": "https://Codenex.com",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://Codenex.com/SearchResults?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>

<!-- Structured Data - BreadcrumbList (customize for each page) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [{
    "@type": "ListItem",
    "position": 1,
    "name": "Home",
    "item": "https://Codenex.com/"
  },{
    "@type": "ListItem",
    "position": 2,
    "name": "[PAGE_NAME]",
    "item": "https://Codenex.com/[PAGE_URL]"
  }]
}
</script>
